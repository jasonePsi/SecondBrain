name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  app_and_proxy:
    name: App + Proxy Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify all (app + backend-proxy)
        run: npm run verify:all
