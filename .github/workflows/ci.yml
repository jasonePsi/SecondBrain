name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  app:
    name: App Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  backend_proxy:
    name: Backend Proxy Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify backend-proxy
        run: npm run verify
